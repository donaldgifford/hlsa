version: '3.8'

services:
  garage:
    image: dxflrs/garage:v1.3.1
    container_name: hlsa-garage
    ports:
      - "3900:3900"   # S3 API
      - "3901:3901"   # Admin API
      - "3902:3902"   # Web
    volumes:
      - garage-data:/var/lib/garage
      - ./garage.toml:/etc/garage.toml:ro
    environment:
      - RUST_LOG=garage=info
    networks:
      - hlsa-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: hlsa-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - hlsa-net

volumes:
  garage-data:
  prometheus-data:

networks:
  hlsa-net:
    driver: bridge
